name: Build reviewed coordinate and provider layers

on:
  push:
    paths:
      - "data/quality/2026/coordinate_manual_review.csv"
      - "data/quality/2026/gsi_address_representative_points.csv"
      - "data/quality/2026/provider_entity_manual_decisions.csv"
      - "data/quality/2026/provider_entity_manual_mapping.csv"
      - "data/quality/2026/facilities_verified_coordinates.csv"
      - "data/quality/2026/coordinate_verification_candidates.csv"
      - "data/snapshots/2026/postnatal_services.csv"
      - "scripts/apply_manual_coordinate_review.py"
      - "scripts/build_provider_entities.py"
      - ".github/workflows/apply_manual_coordinate_review.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Apply coordinate adjudications and representative points
        run: python scripts/apply_manual_coordinate_review.py
      - name: Build provider entity layer
        run: python scripts/build_provider_entities.py
      - name: Run validation tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit reviewed data layers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quality/2026/facilities_final_coordinates.csv data/quality/2026/coordinate_final_summary.json
          git add data/derived/2026
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Build reviewed 2026 coordinate and provider layers"
            git push
          fi
