name: Resolve priority 22 official coordinates
on:
  push:
    paths:
      - "scripts/resolve_priority22.py"
      - ".github/workflows/resolve_priority22.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/resolve_priority22.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quality/2026/priority22_official_coordinate_candidates.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add official coordinate candidates for priority 22"
            git push
          fi
