name: Build provider entity layer

on:
  # The reviewed-data workflow builds coordinates and provider entities in one
  # job so an Actions-generated commit does not need to trigger another workflow.
  # This dispatch remains available as a manual recovery/rebuild command.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build provider and municipality-relation tables
        run: python scripts/build_provider_entities.py
      - name: Commit derived entity layer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/2026
          if git diff --cached --quiet; then
            echo "No derived changes."
          else
            git commit -m "Build 2026 provider entity layer"
            git push
          fi
