name: Probe official coordinate sources

on:
  push:
    paths:
      - "scripts/probe_iryou_net_coordinates.py"
      - ".github/workflows/probe_iryou_net_coordinates.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect MHLW Iryou Information Net open data
        run: python scripts/probe_iryou_net_coordinates.py
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quality/2026/official_coordinate_source_probe.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Assess official MHLW coordinate sources"
            git push
          fi
